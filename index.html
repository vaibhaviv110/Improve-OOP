<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        body {
            background: linear-gradient(135deg, #0b1020, #17152e, #0b1020);
            color: #ffffff;
        }

        /* Card Theme */
        .video-card {
            background: linear-gradient(145deg, #1c2140, #121629);
            border: 1px solid rgba(20, 29, 108, 0.952);
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        /* Hover Effect */
        .video-card:hover {
            transform: translateY(-8px);
            border-color: #3779b0;
            box-shadow: 0 12px 35px rgba(119, 82, 255, 0.25);
        }

        /* Video Theme */
        .video-card video {
            transition: all 0.4s ease;
            border-radius: 14px;
        }

        .video-card:hover video {
            transform: scale(1.02);
        }

        /* Card Title */
        .video-card .card-title {
            color: #ffffff;
            font-weight: 700;
        }

        /* Card Description */
        .video-card .card-text {
            color: #b5bad3;
            line-height: 1.7;
        }

        /* Responsive spacing */
        @media (max-width: 576px) {
            .video-card {
                border-radius: 14px;
            }
        }
    </style>



</head>

<body>

    <nav class="navbar navbar-expand-lg" style="background: linear-gradient(135deg, #1c2140, #121629);
           border-bottom: 1px solid rgba(147,112,255,0.25);">

        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                <i class="fa-brands fa-youtube" style="color: #ff4545;"></i>
                <span class="fw-bold text-white"> YouTube</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation" style="background-color: #9575ff;">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <form class="d-flex align-items-center justify-content-center w-100 gap-3 mt-3 mt-lg-0" role="search">

                    <!-- Search Bar -->
                    <div class="input-group" style="max-width: 600px;">

                        <input class="form-control" type="search" placeholder="Search" aria-label="Search" style="border-radius: 25px 0 0 25px;
                               background-color: #121629;
                               border: 1px solid #49436d;
                               color: white;">

                        <button class="btn" type="submit" style="border-radius: 0 25px 25px 0;
                               background: #292344;
                               border: 1px solid #49436d;
                               color: #ffffff;">

                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>

                    </div>

                    <!-- Microphone -->
                    <button type="button" class="rounded-circle" style="background-color: #292344;
                           color: #ffffff;
                           border: 1px solid #49436d;
                           width: 42px; height: 42px;">

                        <i class="fa-solid fa-microphone"></i>
                    </button>

                    <!-- Create -->
                    <button type="button" class="rounded-pill px-4 fs-sm-3" style="background-color: #292344;
                           color: white;
                           border: 1px solid #49436d;
                           height: 42px;">

                        <i class="fa-solid fa-plus"></i>
                        Create
                    </button>

                    <!-- Notification -->
                    <button type="button" class="rounded-circle" style="background-color: #292344;
                           color: #f6f6f8;
                           border: 1px solid #49436d;
                           width: 42px; height: 42px;">

                        <i class="fa-solid fa-bell"></i>
                    </button>

                </form>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4 d-flex">
                <div class="card  video-card w-100">
                    <video class="card-img-top rounded-4" controls poster="./Image/1 timecovert.png">
                        <source src="./recording/1 Timeconverter.webm" type="video/mp4">
                    </video>
                    <div class="card-body">
                        <h5 class="card-title fs-4">Time converter in C++</h5>
                        <p class="card-text text-tertiary">Time Converter: “Learn to convert time between different
                            Hours To Seconds in C++.</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4 d-flex">
                <div class="card video-card w-100">
                    <video class="card-img-top rounded-4" controls poster="./Image/2 railway thumb.png">
                        <source src="./recording/2 railway system.webm" type="video/mp4">
                    </video>
                    <div class="card-body">
                        <h5 class="card-title fs-4">Railway Reservation System</h5>
                        <p class="card-text text-tertiary">Railway Reservation: “Learn to create a simple railway
                            reservation system in C++.like Source, Destination,Train Time Etc...</p>
                    </div>
                </div>
            </div>





        </div>
    </div>
